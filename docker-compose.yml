# HuntMap — stack for Portainer (Git repository) and plain docker compose.
#
# Portainer -> Stacks -> Add stack -> Repository
#   Repository URL : https://github.com/<you>/<repo>
#   Compose path   : docker-compose.yml
#   Environment    : set HUNTMAP_SECRET_KEY and HUNTMAP_ADMIN_PASSWORD
#
# Command line:  docker compose up -d --build
# Then open https://<docker-host>:8443/ on the phone and accept the certificate.
services:
  huntmap:
    build:
      context: .
      dockerfile: Dockerfile
    image: huntmap:latest
    container_name: huntmap
    restart: unless-stopped
    ports:
      # host:container. Set HUNTMAP_PUBLISH_PORT for just the host side, or
      # HUNTMAP_PORT to move both sides.
      - "${HUNTMAP_PUBLISH_PORT:-${HUNTMAP_PORT:-8443}}:${HUNTMAP_PORT:-8443}"
      # plain http:// on this port redirects to https://<host>:<HUNTMAP_PUBLISH_PORT>
      # (only active while HUNTMAP_HTTPS=1; remove if you terminate TLS elsewhere)
      - "${HUNTMAP_PUBLISH_HTTP_PORT:-8080}:${HUNTMAP_REDIRECT_PORT:-8080}"
    environment:
      # Change both of these before exposing the stack.
      HUNTMAP_SECRET_KEY: "${HUNTMAP_SECRET_KEY:-change-me-to-a-long-random-string}"
      HUNTMAP_ADMIN_USER: "${HUNTMAP_ADMIN_USER:-admin}"
      HUNTMAP_ADMIN_PASSWORD: "${HUNTMAP_ADMIN_PASSWORD:-huntmap}"
      HUNTMAP_ADMIN_EMAIL: "${HUNTMAP_ADMIN_EMAIL:-}"
      # Hosts allowed to reach the app ("*" is fine on a private LAN).
      HUNTMAP_HOSTS: "${HUNTMAP_HOSTS:-*}"
      HUNTMAP_TZ: "${HUNTMAP_TZ:-UTC}"
      # Networking: 1 = HTTPS (default, needed for phone GPS), 0 = plain HTTP
      # behind your own TLS proxy. Keep HUNTMAP_PORT in step with the port mapping.
      HUNTMAP_HTTPS: "${HUNTMAP_HTTPS:-1}"
      HUNTMAP_PORT: "${HUNTMAP_PORT:-8443}"
      HUNTMAP_BIND: "${HUNTMAP_BIND:-0.0.0.0}"
      # http:// on HUNTMAP_PUBLISH_HTTP_PORT is redirected to this https port.
      HUNTMAP_REDIRECT_PORT: "${HUNTMAP_REDIRECT_PORT:-8080}"
      HUNTMAP_PUBLIC_PORT: "${HUNTMAP_PUBLISH_PORT:-${HUNTMAP_PORT:-8443}}"
      # Optional: make the self-signed cert match your address, e.g. IP:192.168.1.50
      HUNTMAP_CERT_SAN: "${HUNTMAP_CERT_SAN:-}"
      HUNTMAP_WORKERS: "${HUNTMAP_WORKERS:-1}"
      HUNTMAP_THREADS: "${HUNTMAP_THREADS:-8}"
    volumes:
      # database, uploaded maps and the TLS certificate live here
      - huntmap-data:/data

volumes:
  huntmap-data:

<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 18px 60px; background: #0d1109; color: #ece7d8;
    font: 15px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  a { color: #e2801f; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #a3ab96;
       margin: 30px 0 10px; }
  .wrap { max-width: 980px; margin: 0 auto; }
  .card { background: #131910; border: 1px solid rgba(233,240,220,.13); border-radius: 14px; padding: 16px; }
  .muted { color: #a3ab96; font-size: 12.5px; }
  .mono { font-family: ui-monospace, Menlo, Consolas, monospace; }
  label { display: block; margin: 0 0 10px; font-size: 12px; color: #a3ab96; }
  input[type=text], input[type=password], input[type=email], input[type=number],
  input[type=file], input[type=search], select, textarea {
    width: 100%; margin-top: 4px; padding: 10px 12px; background: rgba(255,255,255,.06);
    border: 1px solid rgba(233,240,220,.16); border-radius: 10px; color: #ece7d8; font-size: 15px;
  }
  textarea { resize: vertical; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; align-items: flex-end; }
  .row > * { flex: 1 1 220px; }
  .row .narrow { flex: 0 0 110px; }
  button, .btn {
    display: inline-block; padding: 11px 18px; border-radius: 10px; border: 1px solid #e2801f;
    background: #e2801f; color: #14180f; font-weight: 700; font-size: 15px; cursor: pointer;
    text-decoration: none;
  }
  .btn.ghost { background: transparent; color: #ece7d8; border-color: rgba(233,240,220,.25); font-weight: 600; }
  button:hover, .btn:hover { filter: brightness(1.07); }
  .msg { padding: 9px 12px; border-radius: 10px; margin: 0 0 10px; font-size: 13px; }
  .msg.success { background: rgba(142,196,106,.12); border: 1px solid rgba(142,196,106,.4); }
  .msg.error { background: rgba(226,81,63,.12); border: 1px solid rgba(226,81,63,.45); }
  .errlist { margin: 4px 0 0; padding-left: 18px; color: #ffb9ae; font-size: 12.5px; }
  table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  th, td { text-align: left; padding: 9px 8px; border-bottom: 1px solid rgba(233,240,220,.1); vertical-align: top; }
  th { color: #a3ab96; font-size: 11px; text-transform: uppercase; letter-spacing: .07em; }
  .pill { display: inline-block; padding: 2px 7px; border-radius: 999px; font-size: 10.5px;
          border: 1px solid rgba(233,240,220,.22); color: #a3ab96; }
  .pill.ok { border-color: rgba(142,196,106,.5); color: #b9dc9c; }
  .pill.warn { border-color: rgba(226,128,31,.5); color: #f0b475; }
  code { background: rgba(255,255,255,.06); padding: 1px 5px; border-radius: 5px; }
  .hint { border-left: 3px solid #e2801f; padding: 8px 12px; background: rgba(255,255,255,.04);
          border-radius: 0 10px 10px 0; font-size: 12.5px; color: #a3ab96; margin: 14px 0 0; }
  .topbar { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
            justify-content: space-between; margin-bottom: 14px; }
  .nav { display: flex; gap: 14px; flex-wrap: wrap; font-size: 13px; align-items: center; }
  .who { font-size: 13px; color: #a3ab96; }
  form.inline { display: inline; }
  form.inline button { padding: 4px 10px; font-size: 12px; border-radius: 8px; }
</style>
